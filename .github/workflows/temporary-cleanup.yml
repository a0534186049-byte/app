name: Temporary cleanup of merged development branches

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-merged-branches]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged development branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = ["device-lab-v2", "probe-stage0", "consolidate-probe-source"];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.info(`Deleted branch ${branch}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Branch ${branch} is already absent`);
                } else {
                  throw error;
                }
              }
            }

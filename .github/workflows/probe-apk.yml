name: Build Device Lab Probe APK

on:
  push:
    branches: [ "probe-stage0" ]
    paths:
      - "device-lab-probe-source.tar.xz.part*"
      - ".github/workflows/probe-apk.yml"
      - "device-lab-probe/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Probe APK and verify merged manifest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack and materialize isolated Probe project
        run: |
          if [ -f device-lab-probe-source.tar.xz.part01 ]; then
            cat device-lab-probe-source.tar.xz.part0* > /tmp/device-lab-probe-source.tar.xz.b64
            base64 --decode /tmp/device-lab-probe-source.tar.xz.b64 > /tmp/device-lab-probe-source.tar.xz
            xz -t /tmp/device-lab-probe-source.tar.xz
            tar -xJf /tmp/device-lab-probe-source.tar.xz -C .
            rm -f device-lab-probe-source.tar.xz.part*
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Materialize standalone Device Lab Probe source"
              git push
            fi
          elif [ ! -d device-lab-probe ]; then
            echo "Probe archive parts and source directory are both missing" >&2
            exit 1
          fi
      - name: Compile Probe APK
        run: cd device-lab-probe && gradle --no-daemon --console=plain --stacktrace assembleDebug
      - name: Verify merged manifest permissions
        run: python3 device-lab-probe/scripts/check_merged_manifest.py device-lab-probe
      - name: Upload APK and merged manifest
        uses: actions/upload-artifact@v4
        with:
          name: DeviceLabProbe-debug-apk
          path: |
            device-lab-probe/app/build/outputs/apk/debug/app-debug.apk
            device-lab-probe/app/build/intermediates/merged_manifest/debug/**/AndroidManifest.xml
          if-no-files-found: error
          retention-days: 14
